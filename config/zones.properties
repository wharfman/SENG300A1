# Zone rules and branding for the GoCycle station kiosks.
# Edit and restart the rider app to apply. Keys are <zoneId>.<setting>.
#   payments: comma-separated from CREDIT_CARD, TRANSIT_CARD, PHONE_WALLET
#   colours:  #RRGGBB (shown on the kiosk screen header)

downtown.name=Downtown
downtown.payments=CREDIT_CARD,TRANSIT_CARD,PHONE_WALLET
downtown.primaryColour=#0057B8
downtown.secondaryColour=#FFC72C
downtown.logoPath=branding/downtown-logo.png

kensington.name=Kensington
kensington.payments=TRANSIT_CARD,PHONE_WALLET
kensington.primaryColour=#2E7D32
kensington.secondaryColour=#A5D6A7
kensington.logoPath=branding/kensington-logo.png
